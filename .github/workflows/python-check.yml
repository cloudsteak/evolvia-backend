name: Python check

on:
  workflow_call:
    inputs:
      path:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      version-file:
        required: false
        type: string
        default: ""
      lockfile:
        required: false
        type: string
        default: ""
      base-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ inputs.path }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: ${{ inputs.lockfile != '' && inputs.lockfile || inputs.path }}

      - name: Ruff
        run: uv run --with ruff ruff check ${{ inputs.path }}

      - name: Pytest
        working-directory: ${{ inputs.path }}
        run: |
          if find . \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            uv sync --group dev
            uv run pytest
          else
            echo "no tests"
          fi

  version:
    name: Version bump ${{ inputs.path }}
    if: inputs.version-file != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require version bump
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          BASE_SHA: ${{ inputs.base-sha }}
        run: |
          set -euo pipefail
          current=$(grep '^version =' "$VERSION_FILE" | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$current" ] || [ "$current" = "latest" ]; then
            echo "image tag must be a pinned semver, not empty or latest"
            exit 1
          fi
          if git cat-file -e "$BASE_SHA:$VERSION_FILE" 2>/dev/null; then
            main=$(git show "$BASE_SHA:$VERSION_FILE" | grep '^version =' | sed 's/version = "\(.*\)"/\1/')
            if [ "$current" = "$main" ]; then
              echo "version not bumped in $VERSION_FILE ($current)"
              exit 1
            fi
            echo "version $main -> $current"
          else
            echo "new $VERSION_FILE ($current)"
          fi

  image:
    name: Docker build ${{ inputs.path }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.path }}
          file: ./${{ inputs.dockerfile }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: false
          load: true
