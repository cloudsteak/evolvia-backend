name: ECR backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/ecr-backend.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: evolvia-backend

jobs:
  build:
    name: Build and push ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(grep '^version =' backend/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$version" ] || [ "$version" = "latest" ]; then
            echo "image tag must be a pinned semver, not empty or latest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.lambda
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
